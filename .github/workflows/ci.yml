name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + migrations)
    runs-on: ubuntu-latest
    services:
      db:
        # Postgres 16 with the pgvector extension, same as docker-compose.yml
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veluntra
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: veluntra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veluntra -d veluntra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: veluntra
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: veluntra
      POSTGRES_HOST: localhost
      SECRET_KEY: ci-only-secret-key-ci-only-secret-key-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
